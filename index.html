<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X bookmarks</title>
<style>
  :root{--bg:#fff;--fg:#111;--mute:#666;--line:#e3e3e3;--chip:#f1f1f1;--accent:#1d9bf0}
  @media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mute:#999;--line:#2a2a2a;--chip:#1e1e1e}}
  body{font:15px/1.45 system-ui,sans-serif;max-width:820px;margin:1.5rem auto;padding:0 1rem;color:var(--fg);background:var(--bg)}
  a{color:var(--accent)}
  header{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  h1{font-size:22px;margin:0;flex:1}
  #meta{color:var(--mute);font-size:13px}
  #q{width:100%;font:inherit;padding:.6rem;box-sizing:border-box;margin:.8rem 0 .6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
  #chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:.25rem .7rem;font:inherit;font-size:13px;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .row{display:flex;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
  .row .body{flex:1;min-width:0}
  .who{font-size:13px;color:var(--mute)}
  .who b{color:var(--fg)}
  .text{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;margin:.15rem 0}
  .text.open{-webkit-line-clamp:unset}
  .links a{display:block;font-size:13px;word-break:break-all}
  .thumb{width:72px;height:72px;object-fit:cover;border-radius:6px;flex:none}
  select{font:inherit;font-size:13px;margin-top:.3rem;padding:.15rem .3rem;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
  select.manual{border-color:var(--accent)}
  button.act{font:inherit;font-size:13px;padding:.35rem .8rem;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
  #save:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fff}
  #more{display:block;margin:1rem auto}
</style>
<header>
  <h1>X bookmarks</h1>
  <button id="save" class="act" disabled>Saved</button>
</header>
<div id="meta">loading…</div>
<input id="q" type="search" placeholder="search text, author, handle…" aria-label="Search bookmarks">
<div id="chips" role="toolbar" aria-label="Filter by category"></div>
<div id="list"></div>
<button id="more" class="act" hidden>Load more</button>
<script src="rules.js"></script>
<script>
const REPO = 'AakashPawarAP/x-bookmarks', FILE = 'categories.json', PAGE = 200;
const BUILTIN = ['Trading', 'AI', 'Coding', 'Career', 'Business', 'Health', 'Trivia', 'Meme', 'Other'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let all = [], auto = {}, remote = {};                          // remote = categories.json in the repo
let local = JSON.parse(localStorage.getItem('pending') || '{}'); // unsaved manual picks on this device
let active = 'All', shown = PAGE;

const catOf = b => local[b.id] ?? remote[b.id] ?? auto[b.id];
const isManual = b => b.id in local || b.id in remote;
const cats = () => [...new Set([...BUILTIN, ...Object.values(remote), ...Object.values(local)])];

function filtered() {
  const q = $('q').value.toLowerCase();
  return all.filter(b => (active === 'All' || catOf(b) === active) &&
    (!q || `${b.text} ${b.author} ${b.handle}`.toLowerCase().includes(q)));
}

function renderChips() {
  const counts = {};
  for (const b of all) counts[catOf(b)] = (counts[catOf(b)] || 0) + 1;
  $('chips').innerHTML = ['All', ...cats()].filter(c => c === 'All' || counts[c])
    .map(c => `<button class="chip" aria-pressed="${c === active}" data-c="${esc(c)}">${esc(c)} ${c === 'All' ? all.length : counts[c]}</button>`).join('');
}

function renderList() {
  const rows = filtered(), opts = cats();
  $('list').innerHTML = rows.slice(0, shown).map(b => {
    const c = catOf(b);
    const text = decode(b.text).replace(/https:\/\/t\.co\/\w+/g, '').trim();
    return `<div class="row">
      ${b.media?.length ? `<a href="${esc(b.url)}" target="_blank" rel="noopener"><img class="thumb" loading="lazy" alt="" src="${esc(b.media[0])}?name=small"></a>` : ''}
      <div class="body">
        <div class="who"><b>${esc(b.author)}</b> @${esc(b.handle)} · <a href="${esc(b.url)}" target="_blank" rel="noopener">${esc((b.created_at || '').replace(/ \+0000/, ''))}</a></div>
        ${text ? `<div class="text">${esc(text)}</div>` : ''}
        <div class="links">${(b.urls || []).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('')}</div>
        <select data-id="${esc(b.id)}" class="${isManual(b) ? 'manual' : ''}" aria-label="Category">
          ${opts.map(o => `<option${o === c ? ' selected' : ''}>${esc(o)}</option>`).join('')}
          <option value="__new">+ New category…</option>
        </select>
      </div></div>`;
  }).join('');
  $('more').hidden = rows.length <= shown;
  $('meta').textContent = `${rows.length} of ${all.length} · updated ${window.updatedAt || ''}`;
}

function render() { renderChips(); renderList(); updateSave(); }

function updateSave() {
  const n = Object.keys(local).length;
  $('save').disabled = !n;
  $('save').textContent = n ? `Save ${n} change${n > 1 ? 's' : ''} to GitHub` : 'Saved';
}

// --- GitHub persistence -------------------------------------------------
const toB64 = s => { const u = new TextEncoder().encode(s); let r = ''; for (let i = 0; i < u.length; i += 8192) r += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(r); };
const fromB64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
const api = (path, opts = {}) => {
  const token = localStorage.getItem('gh_token');
  return fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {...opts,
    headers: {Accept: 'application/vnd.github+json', ...(token ? {Authorization: `Bearer ${token}`} : {}), ...opts.headers}});
};

async function loadRemote() {
  // read through the API so a save shows up immediately; fall back to the Pages copy if rate-limited
  try {
    const r = await api(FILE, {headers: {Accept: 'application/vnd.github.raw+json'}, cache: 'no-store'});
    if (r.ok) return r.json();
  } catch {}
  return fetch(FILE, {cache: 'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
}

async function save() {
  let token = localStorage.getItem('gh_token');
  if (!token) {
    token = prompt('Paste a GitHub fine-grained token with "Contents: Read and write" on AakashPawarAP/x-bookmarks only.\nIt stays in this browser (localStorage).');
    if (!token) return;
    localStorage.setItem('gh_token', token.trim());
  }
  $('save').disabled = true; $('save').textContent = 'Saving…';
  for (let attempt = 0; attempt < 2; attempt++) {
    const cur = await api(FILE, {cache: 'no-store'});
    if (cur.status === 401) { localStorage.removeItem('gh_token'); alert('Token rejected. Click save again to enter a new one.'); return updateSave(); }
    const {sha, content} = cur.ok ? await cur.json() : {};
    const merged = {...(content ? JSON.parse(fromB64(content)) : {}), ...local};
    const sorted = Object.fromEntries(Object.entries(merged).sort());
    const r = await api(FILE, {method: 'PUT', body: JSON.stringify({
      message: `categorize ${Object.keys(local).length} bookmark(s)`, content: toB64(JSON.stringify(sorted, null, 1) + '\n'), ...(sha ? {sha} : {})})});
    if (r.ok) { remote = sorted; local = {}; localStorage.setItem('pending', '{}'); return render(); }
    if (r.status !== 409) { alert(`Save failed: ${r.status} ${await r.text()}`); return updateSave(); }
  }
  alert('Save conflicted twice; reload and try again.'); updateSave();
}

// --- events ---------------------------------------------------------------
$('q').oninput = () => { shown = PAGE; renderList(); };
$('chips').onclick = e => { const c = e.target.closest('.chip')?.dataset.c; if (c) { active = c; shown = PAGE; renderChips(); renderList(); } };
$('more').onclick = () => { shown += PAGE; renderList(); };
$('save').onclick = save;
$('list').onclick = e => e.target.classList.contains('text') && e.target.classList.toggle('open');
$('list').onchange = e => {
  const sel = e.target; if (sel.tagName !== 'SELECT') return;
  let c = sel.value;
  if (c === '__new') { c = (prompt('New category name') || '').trim(); if (!c) return renderList(); }
  const id = sel.dataset.id;
  if (c === (remote[id] ?? auto[id])) delete local[id]; else local[id] = c;
  localStorage.setItem('pending', JSON.stringify(local));
  renderChips(); updateSave();
  sel.classList.add('manual');
  if (!cats().every(o => [...sel.options].some(x => x.value === o))) renderList(); // new category: refresh dropdowns
  else if (active !== 'All' && c !== active) sel.closest('.row').style.opacity = .4; // fades until next filter change
};
window.onbeforeunload = () => Object.keys(local).length ? true : undefined;

Promise.all([fetch('bookmarks.json').then(r => r.json()), loadRemote()]).then(([d, rem]) => {
  all = d.bookmarks; window.updatedAt = d.updated_at; remote = rem || {};
  auto = categorizeAll(all);
  document.title = `X bookmarks (${all.length})`;
  render();
});
</script>
